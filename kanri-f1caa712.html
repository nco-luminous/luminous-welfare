<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA（ホーム画面インストール）対応 -->
  <meta name="theme-color" content="#E67E22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Hiragino Sans','Meiryo','Yu Gothic',sans-serif;background:#FFF8F0;color:#2C3E50}
    :root{
      --or:#E67E22;--or2:#D35400;--orl:#F39C12;--orp:#FFF3E0;--orb:#FDEBD0;--cr:#FFF8F0;
      --tx:#2C3E50;--tl:#7F8C8D;--bd:#E8E8E8;
      --gn:#27AE60;--rd:#E74C3C;--bl:#3498DB;--pu:#9B59B6;--yw:#F39C12
    }
    .app{display:flex;min-height:100vh}
    .sidebar{width:232px;background:linear-gradient(180deg,#E67E22 0%,#D35400 100%);color:white;
      display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100}
    .sidebar-logo{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.2)}
    .sidebar-logo h1{font-size:19px;font-weight:700;letter-spacing:.5px}
    .sidebar-logo p{font-size:10px;opacity:.8;margin-top:2px}
    .sidebar-nav{padding:10px 0;flex:1}
    .nav-item{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;
      transition:background .15s;font-size:12.5px;border-left:3px solid transparent}
    .nav-item:hover{background:rgba(255,255,255,.15)}
    .nav-item.active{background:rgba(255,255,255,.22);border-left-color:white;font-weight:700}
    .nav-icon{font-size:15px;width:20px;text-align:center}
    .sidebar-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.2);font-size:10px;opacity:.65}
    .main{margin-left:232px;flex:1;padding:22px;min-height:100vh}
    .page-header{margin-bottom:18px}
    .page-header h2{font-size:21px;font-weight:700}
    .page-header p{color:var(--tl);font-size:12.5px;margin-top:3px}
    .card{background:white;border-radius:12px;border:1px solid var(--orb);padding:16px;
      box-shadow:0 2px 8px rgba(230,126,34,.07)}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
    .stat-card{background:white;border-radius:12px;padding:16px;border:1px solid var(--orb);
      box-shadow:0 2px 8px rgba(230,126,34,.07)}
    .stat-label{font-size:11px;color:var(--tl);margin-bottom:5px}
    .stat-value{font-size:26px;font-weight:700;color:var(--or)}
    .stat-sub{font-size:11px;color:var(--tl);margin-top:2px}
    .action-bar{display:flex;justify-content:space-between;align-items:center;
      margin-bottom:14px;gap:10px;flex-wrap:wrap}
    .btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12.5px;
      font-weight:600;transition:all .15s;font-family:inherit;white-space:nowrap}
    .btn-primary{background:var(--or);color:white}
    .btn-primary:hover{background:var(--or2)}
    .btn-outline{background:white;color:var(--or);border:1.5px solid var(--or)}
    .btn-outline:hover{background:var(--orp)}
    .btn-ghost{background:transparent;color:var(--tl)}
    .btn-ghost:hover{background:#f5f5f5}
    .btn-danger{background:var(--rd);color:white}
    .btn-success{background:var(--gn);color:white}
    .btn-sm{padding:5px 9px;font-size:11.5px}
    .btn-xs{padding:3px 7px;font-size:11px}
    .search-input{padding:7px 11px;border-radius:7px;border:1.5px solid var(--orb);
      font-size:12.5px;background:white;font-family:inherit}
    .search-input:focus{outline:none;border-color:var(--or)}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{background:#FFF8F0;padding:9px 11px;text-align:left;font-weight:600;
      border-bottom:2px solid var(--orb);white-space:nowrap}
    td{padding:9px 11px;border-bottom:1px solid var(--bd);vertical-align:middle}
    tr:hover td{background:#FFFBF5}
    .tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;
      background:var(--orp);color:var(--or)}
    .badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:11px;font-weight:600}
    .b-gn{background:#E9F7EF;color:var(--gn)}
    .b-rd{background:#FDEDEC;color:var(--rd)}
    .b-or{background:var(--orp);color:var(--or)}
    .b-bl{background:#EBF5FB;color:var(--bl)}
    .b-pu{background:#F5EEF8;color:var(--pu)}
    .b-yw{background:#FEF9E7;color:#B7770D}
    .b-gy{background:#F5F5F5;color:#777}
    .notice{padding:9px 13px;border-radius:7px;font-size:12.5px;margin-bottom:10px;border-left:3px solid}
    .n-info{background:#EBF5FB;border-color:var(--bl);color:#1A5276}
    .n-warn{background:#FEF9E7;border-color:var(--yw);color:#7D6608}
    .n-danger{background:#FDEDEC;border-color:var(--rd);color:#922B21}
    .n-success{background:#E9F7EF;border-color:var(--gn);color:#1E8449}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);
      display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
    .modal{background:white;border-radius:14px;padding:22px;max-width:620px;width:100%;
      max-height:90vh;overflow-y:auto}
    .modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .modal-hdr h3{font-size:16px;font-weight:700}
    .modal-cls{background:none;border:none;font-size:20px;cursor:pointer;color:#888;line-height:1}
    .modal-ftr{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;
      padding-top:14px;border-top:1px solid var(--bd)}
    .fg{margin-bottom:12px}
    .fg label{display:block;font-size:11px;font-weight:600;color:var(--tl);margin-bottom:4px}
    .fc{width:100%;padding:7px 11px;border-radius:7px;border:1.5px solid var(--orb);
      font-size:12.5px;background:white;font-family:inherit}
    .fc:focus{outline:none;border-color:var(--or)}
    .fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .empty-state{text-align:center;padding:36px 16px;color:var(--tl)}
    .empty-icon{font-size:38px;margin-bottom:10px}
    .tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:2px solid var(--orb)}
    .tab{padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--tl);
      border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s}
    .tab.active{color:var(--or);border-bottom-color:var(--or)}
    .care-rec{padding:11px 13px;background:#FAFAFA;border-radius:8px;margin-bottom:9px}
    .care-rec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .care-meta{font-size:11px;color:var(--tl)}
    .pbar{height:7px;background:#eee;border-radius:4px;overflow:hidden}
    .pfill{height:100%;border-radius:4px;transition:width .3s}
    .kasan-card{border:1.5px solid var(--orb);border-radius:10px;padding:13px;margin-bottom:9px}
    .kasan-on{border-color:var(--gn);background:#F8FFF8}
    .kasan-off{border-color:#ddd;background:#FAFAFA}
    .kasan-warn{border-color:var(--yw);background:#FFFEF0}
    .toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
    .toggle{width:40px;height:22px;background:#ccc;border-radius:11px;position:relative;
      cursor:pointer;transition:background .2s;flex-shrink:0}
    .toggle.ton{background:var(--gn)}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;
      background:white;border-radius:50%;transition:left .2s}
    .toggle.ton::after{left:20px}
    .section-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--tx)}
    .divider{height:1px;background:var(--bd);margin:16px 0}
    .alert-banner{padding:9px 13px;border-radius:7px;font-size:12px;margin-bottom:10px;
      display:flex;align-items:center;gap:8px}
    .al-warn{background:#FEF9E7;border:1px solid var(--yw);color:#7D6608}
    .al-danger{background:#FDEDEC;border:1px solid var(--rd);color:#922B21}
    .al-success{background:#E9F7EF;border:1px solid var(--gn);color:#1E8449}
    /* ===== AI アシスタント ===== */
    .ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:420px}
    .ai-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .ai-chip{padding:6px 12px;border-radius:18px;border:1.5px solid var(--orb);background:white;
      color:var(--or);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
    .ai-chip:hover{background:var(--orp);border-color:var(--or)}
    .ai-chip:disabled{opacity:.45;cursor:not-allowed}
    .ai-msgs{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px}
    .ai-row{display:flex;gap:9px;max-width:88%}
    .ai-row.user{align-self:flex-end;flex-direction:row-reverse}
    .ai-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
      justify-content:center;font-size:15px}
    .ai-av.bot{background:linear-gradient(135deg,#E67E22,#D35400);color:white}
    .ai-av.user{background:#EBF5FB;color:var(--bl)}
    .ai-bubble{padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.65;white-space:pre-wrap;
      word-break:break-word}
    .ai-bubble.bot{background:white;border:1px solid var(--orb);color:var(--tx)}
    .ai-bubble.user{background:var(--or);color:white}
    .ai-input-bar{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
    .ai-input{flex:1;padding:9px 12px;border-radius:10px;border:1.5px solid var(--orb);font-size:13px;
      font-family:inherit;resize:none;max-height:120px;background:white}
    .ai-input:focus{outline:none;border-color:var(--or)}
    .ai-cursor{display:inline-block;width:7px;height:14px;background:var(--or);
      margin-left:1px;vertical-align:middle;animation:blink 1s step-start infinite}
    @keyframes blink{50%{opacity:0}}
    .ai-setup{max-width:560px;margin:0 auto}
    .ai-bubble .md-h{font-weight:700;font-size:13.5px;margin:6px 0 3px}
    .ai-bubble ul,.ai-bubble ol{margin:4px 0 4px 20px}
    .ai-bubble li{margin:2px 0}
    .ai-bubble code{background:#F4ECE4;padding:1px 5px;border-radius:4px;font-size:12px;
      font-family:'SFMono-Regular',Consolas,monospace}
    .ai-bubble.bot strong{color:var(--or2)}
    .ai-bubble .md-sp{height:6px}
    /* ===== スマホ対応（840px以下：サイドバーを上部の横スクロールナビに変形） ===== */
    @media (max-width:840px){
      .app{flex-direction:column}
      .sidebar{position:sticky;top:0;width:100%;height:auto;flex-direction:column;overflow:visible}
      .sidebar-logo{padding:10px 14px}
      .sidebar-logo p{display:none}
      .sidebar-nav{display:flex;overflow-x:auto;padding:0 4px;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      .sidebar-nav::-webkit-scrollbar{display:none}
      .nav-item{flex:0 0 auto;border-left:none;border-bottom:3px solid transparent;padding:9px 10px;font-size:12px;gap:5px}
      .nav-item.active{border-bottom-color:white}
      .sidebar-footer{display:flex;align-items:center;gap:8px;padding:8px 14px}
      .sidebar-footer>div{margin-bottom:0!important;flex:1}
      .sidebar-footer p{display:none}
      .main{margin-left:0;padding:12px;min-height:auto}
      .fr2,.fr3{grid-template-columns:1fr}
      .card-grid{grid-template-columns:repeat(2,1fr)!important}
      /* インラインstyleの多カラムgridを1カラム化（スマホでは縦積み） */
      .main div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
      .main div[style*="repeat(4"]{grid-template-columns:repeat(2,1fr)!important}
      .page-header h2{font-size:18px}
      .modal{padding:14px;max-height:94vh}
      .ai-wrap{height:calc(100vh - 170px)}
      .stat-value{font-size:21px}
      table{font-size:12px}
      th,td{padding:7px 8px}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo} = React;

// ===== HELPERS =====
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const today=()=>new Date().toISOString().split('T')[0];
const genId=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,5);
const yen=(n)=>'¥'+(Math.floor(n||0)).toLocaleString();
const initD=(key,def)=>{const ex=ls(key,null);if(!ex){ss(key,def);return def;}return ex;};
const curM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};

// ===== データのバックアップ／復元 =====
// localStorage に保存される全データのキー。新しい保存先を追加したらここにも追記すること。
const DATA_KEYS=['residents','careRecords','staff','shifts','legalUpdates','kasanSettings','accounting','billing','billing_check','ruminasu_contracts','ruminasu_training'];
const exportAllData=()=>{
  const dump={_app:'ruminasu',_exportedAt:new Date().toISOString()};
  DATA_KEYS.forEach(k=>{const v=ls(k,null);if(v!==null)dump[k]=v;});
  const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='るみなす_バックアップ_'+today()+'.json';a.click();URL.revokeObjectURL(url);
};
const importAllData=(file)=>{
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const keys=DATA_KEYS.filter(k=>data[k]!==undefined);
      if(keys.length===0){alert('このファイルには復元できるデータが見つかりませんでした。');return;}
      if(!window.confirm(`バックアップから ${keys.length} 種類のデータを復元します。\n現在のデータは上書きされます。よろしいですか？`))return;
      keys.forEach(k=>ss(k,data[k]));
      alert('復元しました。画面を再読み込みします。');
      location.reload();
    }catch(err){alert('復元に失敗しました：'+(err.message||err));}
  };
  reader.readAsText(file);
};

// ===== 加算 DEFINITIONS =====
const KASAN_DEF={
  tokuteiJigyosho:{name:'特定事業所加算',services:['居宅介護'],
    options:[
      {level:'I',rate:0.20,label:'加算Ⅰ（+20%）',req:['サ責常勤専従配置','月次報告書作成','24時間連絡体制','定期研修実施']},
      {level:'II',rate:0.10,label:'加算Ⅱ（+10%）',req:['サ責常勤配置','月次報告書作成','定期研修実施']},
      {level:'III',rate:0.10,label:'加算Ⅲ（+10%）',req:['常勤ヘルパー配置','定期研修実施']},
      {level:'A',rate:0.03,label:'加算A（+3%）',req:['基本要件充足']},
      {level:'なし',rate:0,label:'なし',req:[]},
    ]},
  taisei:{name:'サービス提供体制強化加算',services:['居宅介護','重度訪問介護'],
    options:[
      {level:'I',units:6,label:'加算Ⅰ（+6単位/回）',req:['介護福祉士70%以上']},
      {level:'II',units:4,label:'加算Ⅱ（+4単位/回）',req:['介護福祉士50%以上']},
      {level:'III',units:2,label:'加算Ⅲ（+2単位/回）',req:['介護福祉士30%以上']},
      {level:'なし',units:0,label:'なし',req:[]},
    ]},
  shokai:{name:'初回加算',services:['居宅介護'],units:200,desc:'新規利用者の初月に200単位を加算'},
  // 令和6年度改定で旧3加算（処遇改善・特定処遇改善・ベースアップ等支援）は
  // 「福祉・介護職員等処遇改善加算」に一本化。さらに【令和8年6月提供分から改定】：
  // Ⅰ・Ⅱに上位区分「ロ」を新設（従来はイ）・全体の率を引き上げ。
  // 加算率は「基本サービス費＋各種加算（処遇改善加算を除く）の総単位数」に乗じる。
  // 料率出典：R8年度報酬改定（カイビズ・介護のコミミの2社で一致確認、2026-07）。
  // ※令和8年5月提供分まではⅢ=居宅34.7%/重訪27.3%（旧率）。実績報告(R7年度分)は旧率で作成。
  shogu:{name:'福祉・介護職員等処遇改善加算',services:['居宅介護','重度訪問介護'],
    serviceRates:{
      '居宅介護':[
        {level:'Iロ',rate:0.456,label:'加算Ⅰロ（45.6%）'},{level:'Iイ',rate:0.446,label:'加算Ⅰイ（44.6%）'},
        {level:'IIロ',rate:0.441,label:'加算Ⅱロ（44.1%）'},{level:'IIイ',rate:0.431,label:'加算Ⅱイ（43.1%）'},
        {level:'III',rate:0.376,label:'加算Ⅲ（37.6%）'},{level:'IV',rate:0.302,label:'加算Ⅳ（30.2%）'},
        {level:'なし',rate:0,label:'なし'}],
      '重度訪問介護':[
        {level:'Iロ',rate:0.382,label:'加算Ⅰロ（38.2%）'},{level:'Iイ',rate:0.372,label:'加算Ⅰイ（37.2%）'},
        {level:'IIロ',rate:0.367,label:'加算Ⅱロ（36.7%）'},{level:'IIイ',rate:0.357,label:'加算Ⅱイ（35.7%）'},
        {level:'III',rate:0.302,label:'加算Ⅲ（30.2%）'},{level:'IV',rate:0.248,label:'加算Ⅳ（24.8%）'},
        {level:'なし',rate:0,label:'なし'}],
    },req:['月額賃金改善要件Ⅰ・Ⅱ','キャリアパス要件Ⅰ〜Ⅲ','職場環境等要件','賃金改善計画書・実績報告書の提出']},
};
const UNIT_PRICE=10.21;

// ===== 初期データ =====
// 【個人情報保護】実在の利用者・スタッフ情報はこのファイルに直書きしない。
// 実データはブラウザ内（localStorage）に保存され、サイドバーの「💾 バックアップ」で
// JSONに書き出し・「📥 復元」で読み込める。新しい端末では空の状態から開始し、
// バックアップJSONを復元するか、利用者管理／スタッフ一覧から登録する。
const INIT_RESIDENTS=[];
const INIT_STAFF=[];
const DEFAULT_KASAN={
  tokuteiJigyosho:{enabled:false,level:'なし'}, // 常勤サ責1名のため未算定（要件＝常勤2名以上）
  taisei:{enabled:false,level:'なし'},
  shokai:{enabled:true},
  shogu:{enabled:true,level:'III'}, // 福祉・介護職員等処遇改善加算Ⅲ（るみなす取得区分）
};
// 旧3加算（shoguu/tokutei/base）で保存された設定を新しい一本化形式へ移行する
const migrateKasan=(k)=>{
  if(!k||typeof k!=='object')return {...DEFAULT_KASAN};
  if(k.shogu)return k; // 既に新形式
  return {
    tokuteiJigyosho:k.tokuteiJigyosho||{enabled:true,level:'II'},
    taisei:k.taisei||{enabled:false,level:'なし'},
    shokai:k.shokai||{enabled:true},
    shogu:{enabled:k.shoguu?!!k.shoguu.enabled:true,level:'III'},
  };
};
const KK_BILLING=initD('billing',{
  syncedAt:'—',syncedAtLabel:'未同期（バックアップから復元してください）',
  transmitStatus:'—',reviewStatus:'—',reviewMonth:'—',
  officeCode:'',officeName:'るみなす',
  months:[
    {label:'サンプル1月',month:'2026-01',totalUnits:0,totalService:0,totalPaid:0,totalCopay:0,residents:[]},
    {label:'サンプル2月',month:'2026-02',totalUnits:0,totalService:0,totalPaid:0,totalCopay:0,residents:[]},

const COPAY_CLASSES=['生活保護','低所得Ⅰ','低所得Ⅱ','一般1','一般2'];

const UNIT_RATES={'居宅介護':263,'重度訪問介護':183,'移動支援':100,'その他':200};

// ===== 加算計算 =====
function calcKasan(residents,kasan){
  return residents.map(res=>{
    const hrs=parseInt(res.serviceHours)||0;
    // 居宅介護・重度訪問介護は国保連請求。移動支援は地域生活支援事業（市町村請求）で
    // 国保連の加算体系・処遇改善加算の対象外のため概算扱いとする。
    const isKokuho=['居宅介護','重度訪問介護'].includes(res.serviceType);
    const ur=UNIT_RATES[res.serviceType]||200;
    const baseU=ur*hrs;
    let extraU=0;const breakdown={};
    if(res.serviceType==='居宅介護'&&kasan.tokuteiJigyosho.enabled){
      const opt=(KASAN_DEF.tokuteiJigyosho.options||[]).find(o=>o.level===kasan.tokuteiJigyosho.level);
      if(opt&&opt.rate>0){const k=Math.floor(baseU*opt.rate);extraU+=k;breakdown.tokutei=k;}
    }
    if(kasan.taisei.enabled&&isKokuho){
      const opt=(KASAN_DEF.taisei.options||[]).find(o=>o.level===kasan.taisei.level);
      if(opt&&opt.units>0){const visits=Math.max(1,Math.ceil(hrs/3));const k=opt.units*visits;extraU+=k;breakdown.taisei=k;}
    }
    if(kasan.shokai.enabled&&res.serviceType==='居宅介護'&&res.isNew){extraU+=200;breakdown.shokai=200;}
    // 小計（基本＋各種加算。処遇改善加算を除く総単位数）
    const subU=baseU+extraU;
    // 福祉・介護職員等処遇改善加算（一本化）。小計に加算率を乗じる
    let shoguU=0;
    if(kasan.shogu&&kasan.shogu.enabled&&isKokuho){
      const rates=KASAN_DEF.shogu.serviceRates[res.serviceType]||[];
      const opt=rates.find(o=>o.level===kasan.shogu.level);
      if(opt&&opt.rate>0){shoguU=Math.floor(subU*opt.rate);breakdown.shogu=shoguU;}
    }
    const totalU=subU+shoguU;
    const totalAmt=Math.floor(totalU*UNIT_PRICE);
    const copayCalc=Math.floor(totalAmt*0.1);
    const copay=res.copayLimit>0?Math.min(copayCalc,res.copayLimit):copayCalc;
    const benefit=totalAmt-copay;
    return{...res,isKokuho,baseU,extraU,subU,shoguU,totalU,totalAmt,copay,benefit,breakdown};
  });
}

// ===== シフト・勤怠管理 =====
function StaffShifts({staff,setStaff,shifts,setShifts}){
  const [month,setMonth]=useState(curM());
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const [staffModal,setStaffModal]=useState(false);
  const [editStaff,setEditStaff]=useState(null);
  const SEMPTY={id:'',staffId:'',date:today(),startTime:'09:00',endTime:'17:00',breakMin:60,notes:''};
  const [form,setForm]=useState(SEMPTY);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const STEMPTY={id:'',name:'',kana:'',role:'ヘルパー（常勤）',employment:'常勤',qualifications:[],monthlySalary:0,hourlyWage:1200,weeklyHours:40,joinDate:today()};
  const [sform,setSform]=useState(STEMPTY);
  const setSF=(k,v)=>setSform(f=>({...f,[k]:v}));
  const mShifts=shifts.filter(s=>s.date&&s.date.startsWith(month));
  // 終了時刻が開始より前なら翌日にまたがる夜勤として扱う（例：22:00〜翌7:00）
  const calcHours=(start,end,brk)=>{
    const [sh,sm]=start.split(':').map(Number);const [eh,em]=end.split(':').map(Number);
    let total=(eh*60+em)-(sh*60+sm);if(total<0)total+=1440;
    return Math.max(0,(total-(brk||0))/60);
  };
  const calcNightHours=(start,end)=>{
    const [sh,sm]=start.split(':').map(Number);const [eh,em]=end.split(':').map(Number);
    const startMin=sh*60+sm;let endMin=eh*60+em;if(endMin<=startMin)endMin+=1440;
    let night=0;
    // 22:00〜翌5:00を深夜とする。日跨ぎ・複数日にも対応（分単位で判定）
    for(let i=startMin;i<endMin;i++){const h=Math.floor(i/60)%24;if(h>=22||h<5)night++;}
    return night/60;
  };
  const staffStats=staff.map(s=>{
    const ss2=mShifts.filter(sh=>sh.staffId===s.id);
    const totalH=ss2.reduce((sum,sh)=>sum+calcHours(sh.startTime,sh.endTime,sh.breakMin),0);
    const nightH=ss2.reduce((sum,sh)=>sum+calcNightHours(sh.startTime,sh.endTime),0);
    const legalH=s.employment==='常勤'?160:s.weeklyHours*4.3;
    const otH=Math.max(0,totalH-legalH);
    const basePay=s.employment==='常勤'?(s.monthlySalary||0):((s.hourlyWage||0)*totalH);
    const otPay=s.employment==='非常勤'?(s.hourlyWage||0)*otH*0.25:0;
    const nightPay=(s.employment==='非常勤'?(s.hourlyWage||0):Math.floor((s.monthlySalary||0)/160))*nightH*0.25;
    return{...s,totalH,nightH,otH,basePay,otPay,nightPay,totalPay:basePay+otPay+nightPay,shiftCount:ss2.length,warn:otH>45};
  });
  const dangerStaff=staffStats.filter(s=>s.warn);
  const saveShift=()=>{
    if(!form.staffId||!form.date)return alert('スタッフと日付は必須です');
    const h=calcHours(form.startTime,form.endTime,form.breakMin);
    const rec={...form,id:edit||genId(),totalH:h};
    const updated=edit?shifts.map(s=>s.id===edit?rec:s):[...shifts,rec];
    setShifts(updated);ss('shifts',updated);setModal(false);
  };
  const delShift=(id)=>{if(!window.confirm('削除しますか？'))return;const u=shifts.filter(s=>s.id!==id);setShifts(u);ss('shifts',u);};
  const saveStaff=()=>{
    if(!sform.name.trim())return alert('スタッフ名を入力してください');
    const rec={...sform,id:editStaff||genId()};
    const updated=editStaff?staff.map(s=>s.id===editStaff?rec:s):[...staff,rec];
    setStaff(updated);ss('staff',updated);setStaffModal(false);
  };
  const delStaff=(id)=>{if(!window.confirm('削除しますか？'))return;const u=staff.filter(s=>s.id!==id);setStaff(u);ss('staff',u);};
  const [activeTab,setActiveTab]=useState('shift');
  return(
    <div>
      <div className="page-header">
        <h2>👥 シフト・勤怠管理</h2>
        <p>月間シフト管理・労働基準法準拠チェック・給与計算をサポートします</p>
      </div>
      {dangerStaff.length>0&&(
        <div className="alert-banner al-danger" style={{marginBottom:14}}>
          ⚠️ 36協定上限（月45時間）超過の可能性：{dangerStaff.map(s=>s.name).join('、')}
        </div>
      )}
      <div className="tabs">
        {[['shift','📅 シフト管理'],['labor','⚖️ 勤怠・給与'],['stafflist','👤 スタッフ一覧']].map(([id,label])=>(
          <div key={id} className={`tab${activeTab===id?' active':''}`} onClick={()=>setActiveTab(id)}>{label}</div>
        ))}
      </div>
      {activeTab==='shift'&&(
        <div>
          <div className="action-bar">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input type="month" className="search-input" value={month} onChange={e=>setMonth(e.target.value)}/>
              <span style={{fontSize:13,fontWeight:600}}>{mShifts.length}件のシフト</span>
            </div>
            <button className="btn btn-primary" onClick={()=>{setForm(SEMPTY);setEdit(null);setModal(true);}}>＋ シフトを追加</button>
          </div>
          <div className="card">
            <div className="table-wrap">
              <table>
                <thead><tr><th>日付</th><th>スタッフ</th><th>開始</th><th>終了</th><th>休憩</th><th>実働時間</th><th>深夜時間</th><th>備考</th><th>操作</th></tr></thead>
                <tbody>
                  {mShifts.length===0?<tr><td colSpan={9}><div className="empty-state"><p>シフトがありません</p></div></td></tr>
                  :mShifts.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{
                    const st=staff.find(f=>f.id===s.staffId);
                    const h=calcHours(s.startTime,s.endTime,s.breakMin);
                    const nh=calcNightHours(s.startTime,s.endTime);
                    return(
                      <tr key={s.id}>
                        <td style={{fontWeight:600}}>{s.date}</td>
                        <td>{st?st.name:'—'} {st&&<span className="badge b-gy" style={{fontSize:10}}>{st.employment}</span>}</td>
                        <td>{s.startTime}</td><td>{s.endTime}</td>
                        <td>{s.breakMin}分</td>
                        <td style={{fontWeight:600,color:h>8?'var(--rd)':'inherit'}}>{h.toFixed(1)}h{h>8&&' ⚠️'}</td>
                        <td style={{color:nh>0?'var(--pu)':'inherit'}}>{nh>0?nh.toFixed(1)+'h':'—'}</td>
                        <td style={{fontSize:12}}>{s.notes}</td>
                        <td><div style={{display:'flex',gap:5}}>
                          <button className="btn btn-outline btn-xs" onClick={()=>{setForm({...s});setEdit(s.id);setModal(true);}}>編集</button>
                          <button className="btn btn-ghost btn-xs" style={{color:'var(--rd)'}} onClick={()=>delShift(s.id)}>削除</button>
                        </div></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
      {activeTab==='labor'&&(
        <div className="card">
          <div className="section-title">⚖️ {month.replace('-','年')}月 勤怠・給与サマリー（労働基準法準拠チェック）</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>スタッフ</th><th>雇用形態</th><th>月間労働時間</th><th>うち深夜</th><th>時間外（超過分）</th><th>基本給</th><th>時間外手当</th><th>深夜手当</th><th>概算総支給</th><th>ステータス</th></tr></thead>
              <tbody>
                {staffStats.map(s=>(
                  <tr key={s.id}>
                    <td style={{fontWeight:700}}>{s.name}</td>
                    <td><span className="badge b-gy">{s.employment}</span></td>
                    <td style={{fontWeight:600}}>{s.totalH.toFixed(1)}h</td>

          </div>

// ===== 加算管理 =====
function KasanManager({kasan,setKasan,staff,residents}){
  const [localK,setLocalK]=useState(kasan);
  const setK=(key,val)=>setLocalK(k=>({...k,[key]:{...k[key],...val}}));
  const save=()=>{setKasan(localK);ss('kasanSettings',localK);alert('加算設定を保存しました');};
  const fuwStaff=staff.filter(s=>(s.qualifications||[]).includes('介護福祉士'));
  const sacho=staff.filter(s=>s.role==='サービス提供責任者'&&s.employment==='常勤');
  const kaigoPct=staff.length>0?Math.round(fuwStaff.length/staff.length*100):0;
  const kkRes=calcKasan(residents,localK);
  const totalBase=kkRes.reduce((s,r)=>s+Math.floor(r.baseU*UNIT_PRICE),0);
  const totalKasan=kkRes.reduce((s,r)=>s+Math.floor((r.totalU-r.baseU)*UNIT_PRICE),0);
  const totalAmt=kkRes.reduce((s,r)=>s+r.totalAmt,0);
  const reqCheck={
    sacho:sacho.length>0,
    kaigo50:kaigoPct>=50,
    kaigo70:kaigoPct>=70,
  };
  return(
    <div>
      <div className="page-header">
        <h2>⚡ 加算管理</h2>

      {!reqCheck.sacho&&(
        <div className="alert-banner al-danger" style={{marginBottom:14}}>
          ⚠️ サービス提供責任者（常勤）が登録されていません。特定事業所加算の要件を確認してください。

      )}

        <div className="stat-card" style={{borderColor:'var(--or)'}}><div className="stat-label">加算込み報酬（概算）</div><div className="stat-value" style={{fontSize:18}}>{yen(totalAmt)}</div><div className="stat-sub">月間総請求額</div></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:18}}>

          <div className="section-title">🏢 事業所要件チェック</div>

            {label:'サ責常勤専従配置',ok:reqCheck.sacho,detail:sacho.length>0?sacho.map(s=>s.name).join('、'):'未登録'},
            {label:'介護福祉士50%以上',ok:reqCheck.kaigo50,detail:`現在 ${kaigoPct}%（${fuwStaff.length}/${staff.length}名）`},
            {label:'介護福祉士70%以上',ok:reqCheck.kaigo70,detail:`現在 ${kaigoPct}%（${fuwStaff.length}/${staff.length}名）`},
          ].map((c,i)=>(

            </div>
          ))}
        </div>
        <div className="card">
          <div className="section-title">💡 月間加算内訳（概算）</div>

          {localK.tokuteiJigyosho.enabled&&(

                <select className="fc" style={{width:280,fontSize:12}} value={localK.taisei.level} onChange={e=>setK('taisei',{level:e.target.value})}>

            <div style={{fontWeight:700,marginBottom:8,fontSize:13,color:'#1A5276'}}>📋 かんたん介護 請求手順</div>
            <div style={{fontSize:12.5,lineHeight:1.9,color:'#1A5276'}}>
              1. <a href="https://www.kantankaigo.jp/home/seikyuus" target="_blank" style={{color:'#2980B9'}}>かんたん介護「請求」ページを開く</a><br/>
              2. 「基本」タブ → 請求日を設定して「集計」ボタンをクリック<br/>
              3. 「請求情報」タブで介護給付費等請求書・明細書を確認<br/>
              4. 「電子請求」タブで伝送データを確認・実行

            <div style={{display:'flex',gap:8,marginTop:10}}>
              <a href="https://www.kantankaigo.jp/home/seikyuus" target="_blank" rel="noreferrer"><button className="btn btn-primary btn-sm">📋 請求ページへ →</button></a>
              <a href="https://www.kantankaigo.jp/home/syuukeis/shougaiCsv" target="_blank" rel="noreferrer"><button className="btn btn-outline btn-sm">📄 集計票を開く</button></a>
            </div>
          </div>}
          {step===3&&<div style={{marginTop:12,padding:'11px 13px',background:'#F5EEF8',borderRadius:8}}>
            <div style={{fontWeight:700,marginBottom:8,fontSize:13,color:'#7D3C98'}}>🏛️ 国保連 電子請求受付システム</div>
            <div style={{fontSize:12.5,lineHeight:1.9,color:'#7D3C98'}}>
              1. <a href="https://www.e-seikyuu.jp/" target="_blank" style={{color:'#7D3C98'}}>e-seikyuu.jp</a> にアクセス ／ 電子証明書でログイン<br/>
              2. かんたん介護から出力した請求データを伝送<br/>
              3. 「送信状況照会」でエラーがないか確認
            </div>
            <a href="https://www.e-seikyuu.jp/" target="_blank" rel="noreferrer"><button className="btn btn-primary btn-sm" style={{marginTop:10}}>🏛️ e-seikyuu.jpを開く</button></a>
          </div>}
          <div style={{display:'flex',justifyContent:'space-between',marginTop:14}}>
            {step>1&&<button className="btn btn-ghost btn-sm" onClick={()=>setStep(s=>s-1)}>◀ 前のステップ</button>}
            {step<4&&<button className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={()=>setStep(s=>s+1)}>次のステップ ▶</button>}
            {step===4&&stepDone(4)&&<div style={{color:'var(--gn)',fontWeight:700,fontSize:13}}>🎉 {month}月の請求業務が完了しました！</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ===== 経理管理 =====
function AccountingManager({acct,setAcct}){
  const [month,setMonth]=useState(curM());
  const [activeTab,setActiveTab]=useState('overview');
  const getM=()=>acct[month]||{income:{kokuhoren:0,city:0,copay:0,other:0},expense:{staff:0,transport:0,office:0,training:0,other:0},openBal:0};
  const md=getM();
  const totalInc=Object.values(md.income).reduce((s,v)=>s+v,0);
  const totalExp=Object.values(md.expense).reduce((s,v)=>s+v,0);
  const profit=totalInc-totalExp;
  const closeBal=(md.openBal||0)+totalInc-totalExp;
  const setField=(section,field,val)=>{
    const updated={...acct,[month]:{...md,[section]:{...md[section],[field]:parseInt(val)||0}}};
    setAcct(updated);ss('accounting',updated);
  };
  const months=Object.keys(acct).sort();
  const INCOME_FIELDS=[
    {key:'kokuhoren',label:'国保連 給付費収入',icon:'🏛️',color:'var(--gn)'},
    {key:'city',label:'札幌市 移動支援補助金',icon:'🏙️',color:'var(--bl)'},
    {key:'copay',label:'利用者負担収入',icon:'👤',color:'var(--or)'},
    {key:'other',label:'その他収入',icon:'📦',color:'#888'},
  ];
  const EXP_FIELDS=[
    {key:'staff',label:'人件費（給与・社会保険料）',icon:'👥',color:'var(--rd)'},
    {key:'transport',label:'交通費・旅費',icon:'🚗',color:'var(--or)'},
    {key:'office',label:'事務費（通信・消耗品・光熱費）',icon:'🏢',color:'var(--yw)'},
    {key:'training',label:'研修費・資格取得費',icon:'📚',color:'var(--bl)'},
    {key:'other',label:'その他経費',icon:'📋',color:'#888'},
  ];
  return(
    <div>
      <div className="page-header">
        <h2>💰 経理管理</h2>
        <p>月次の収入・支出を管理し、損益計算書を自動生成します</p>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <input type="month" className="search-input" value={month} onChange={e=>setMonth(e.target.value)}/>
        <span style={{fontSize:13,fontWeight:600}}>{month.replace('-','年')}月の経理データ</span>
        <button className="btn btn-outline btn-sm" onClick={()=>{
          if(!acct[month]){const upd={...acct,[month]:{income:{kokuhoren:0,city:0,copay:0,other:0},expense:{staff:0,transport:0,office:0,training:0,other:0},openBal:0}};setAcct(upd);ss('accounting',upd);}
        }}>この月のデータを作成</button>
      </div>
      <div className="tabs">
        {[['overview','📊 サマリー'],['income','💴 収入管理'],['expense','💸 支出管理'],['report','📄 月次決算書']].map(([id,label])=>(
          <div key={id} className={`tab${activeTab===id?' active':''}`} onClick={()=>setActiveTab(id)}>{label}</div>
        ))}
      </div>
      {activeTab==='overview'&&(
        <div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}}>
            <div className="stat-card"><div className="stat-label">💴 総収入</div><div className="stat-value" style={{fontSize:18,color:'var(--gn)'}}>{yen(totalInc)}</div></div>
            <div className="stat-card"><div className="stat-label">💸 総支出</div><div className="stat-value" style={{fontSize:18,color:'var(--rd)'}}>{yen(totalExp)}</div></div>
            <div className="stat-card"><div className="stat-label">📈 営業損益</div><div className="stat-value" style={{fontSize:18,color:profit>=0?'var(--gn)':'var(--rd)'}}>{yen(profit)}</div><div className="stat-sub">{profit>=0?'黒字':'赤字'} / 利益率 {totalInc>0?Math.round(profit/totalInc*100):0}%</div></div>
            <div className="stat-card"><div className="stat-label">💼 期末残高（概算）</div><div className="stat-value" style={{fontSize:18,color:'var(--bl)'}}>{yen(closeBal)}</div></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
            <div className="card">
              <div className="section-title">📥 収入内訳</div>
              {INCOME_FIELDS.map(f=>(
                <div key={f.key} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #f5f5f5'}}>
                  <span style={{fontSize:12.5}}>{f.icon} {f.label}</span>
                  <span style={{fontWeight:700,color:f.color,fontSize:13}}>{yen(md.income[f.key]||0)}</span>

                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13}}>{f.label}</div>
                  {f.key==='kokuhoren'&&<div style={{fontSize:11.5,color:'#888',marginTop:2}}>2月実績：{yen(KK_BILLING.months[1].totalPaid)}（参考値）</div>}

          </div>

                  <span style={{fontSize:13,color:'#888'}}>¥</span>

function LegalUpdates({legalUpdates,setLegalUpdates}){
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const EMPTY={id:'',title:'',type:'info',date:today(),source:'',content:''};
  const [form,setForm]=useState(EMPTY);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const save=()=>{
    if(!form.title.trim())return;
    const rec={...form,id:edit||genId()};
    const updated=edit?legalUpdates.map(u=>u.id===edit?rec:u):[...legalUpdates,rec];
    setLegalUpdates(updated);ss('legalUpdates',updated);setModal(false);
  };
  const del=(id)=>{if(!window.confirm('削除しますか？'))return;const u=legalUpdates.filter(l=>l.id!==id);setLegalUpdates(u);ss('legalUpdates',u);};
  const sorted=[...legalUpdates].sort((a,b)=>b.date.localeCompare(a.date));

        <span style={{fontSize:13,fontWeight:600}}>更新情報 {legalUpdates.length}件</span>
        <button className="btn btn-primary" onClick={()=>{setForm(EMPTY);setEdit(null);setModal(true);}}>＋ 更新情報を追加</button>
      </div>
      <div className="card">
        {sorted.length===0
          ?<div className="empty-state"><div className="empty-icon">📢</div><p>更新情報はありません</p></div>
          :sorted.map(u=>(
            <div key={u.id} className={`notice n-${u.type}`} style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13.5}}>{TYPE_LABELS[u.type]||''} {u.title}</div>
                  <div style={{fontSize:11.5,marginTop:3,opacity:.8}}>{u.date}{u.source&&` ／ ${u.source}`}</div>
                  {u.content&&<div style={{fontSize:12.5,marginTop:6,lineHeight:1.6}}>{u.content}</div>}
                </div>
                <div style={{display:'flex',gap:5,flexShrink:0,marginLeft:10}}>
                  <button className="btn btn-ghost btn-xs" onClick={()=>{setForm({...u});setEdit(u.id);setModal(true);}}>編集</button>
                  <button className="btn btn-ghost btn-xs" style={{color:'var(--rd)'}} onClick={()=>del(u.id)}>削除</button>
                </div>

      {modal&&(
        <Modal title={edit?'更新情報を編集':'更新情報を追加'} onClose={()=>setModal(false)}>
          <div className="fg"><label>タイトル *</label><input className="fc" value={form.title} onChange={e=>setF('title',e.target.value)} placeholder="例：令和7年度 障害福祉報酬改定"/></div>
          <div className="fr3">
            <div className="fg"><label>種別</label><select className="fc" value={form.type} onChange={e=>setF('type',e.target.value)}>

            <div className="fg"><label>日付</label><input type="date" className="fc" value={form.date} onChange={e=>setF('date',e.target.value)}/></div>

// データはlocalStorageの新キー ruminasu_contracts / ruminasu_training に保存（既存キーには触れない）
const CONTRACT_CATS=['利用者契約','重要事項説明','職員雇用契約','規程同意','その他'];
const CONTRACT_METHODS=['クラウドサイン','紙','その他'];
const CONTRACT_STATUS=['準備中','送信済','締結済','更新要'];
const TRAIN_FORMATS=['eラーニング','YouTube','外部研修','OJT','法定研修'];
// 障害福祉サービス事業所に義務付けられている法定研修（年1回以上・訓練含む）
const LEGAL_TRAININGS=['虐待防止研修','身体拘束適正化研修','感染症・BCP研修（訓練含む）','個人情報保護研修'];
// 4月始まりの年度（例：2026-03-31 → 2025年度）
const fiscalYear=(d)=>{if(!d)return null;const dt=new Date(d);if(isNaN(dt))return null;return (dt.getMonth()+1)>=4?dt.getFullYear():dt.getFullYear()-1;};
const daysUntil=(d)=>{if(!d)return null;const diff=(new Date(d)-new Date())/(1000*60*60*24);return isNaN(diff)?null:Math.floor(diff);};

function ContractStatusBadge({status}){
  const c={'準備中':'b-gy','送信済':'b-bl','締結済':'b-gn','更新要':'b-rd'};
  return <span className={`badge ${c[status]||'b-gy'}`}>{status}</span>;
}

const pseudo=(prefix,i)=>prefix+(i<26?String.fromCharCode(65+i):('#'+(i+1)));
function buildAISystem({residents,careRecords,staff,kasan,acct},opts){
  const anon=!opts||opts.anonymize!==false; // 既定は匿名化ON（要配慮個人情報の保護）
  // 実名→仮名の対応表（サービス記録などの名前照合に使う）
  const resMap={},staffMap={};
  (residents||[]).forEach((r,i)=>{if(r.name)resMap[r.name]=pseudo('利用者',i);});
  (staff||[]).forEach((s,i)=>{if(s.name)staffMap[s.name]=pseudo('スタッフ',i);});
  const rn=(name)=>!name?'-':(anon?(resMap[name]||'利用者?'):name);
  const sn=(name)=>!name?'-':(anon?(staffMap[name]||'スタッフ?'):name);
  const resLines=(residents||[]).map((r,i)=>
    `・${anon?pseudo('利用者',i):r.name}（${r.supportLevel||'-'}／${r.serviceType||'-'}／月${r.serviceHours||0}時間）期限${r.certExpiry||'-'} 上限${yen(r.copayLimit||0)}${r.isNew?' [新規]':''}`).join('\n');
  const staffLines=(staff||[]).map((s,i)=>
    `・${anon?pseudo('スタッフ',i):s.name}（${s.role||'-'}／${s.employment||'-'}）資格:${(s.qualifications||[]).join('・')||'なし'}`).join('\n');
  const kLines=Object.entries(kasan||{}).map(([k,v])=>{
    const def=KASAN_DEF[k];const nm=def?def.name:k;
    return `・${nm}: ${v.enabled?('適用'+(v.level?'（'+v.level+'）':'')):'未適用'}`;}).join('\n');
  const billLines=(KK_BILLING.months||[]).map(m=>`・${m.label}: 請求額${yen(m.totalService)}／単位${m.totalUnits}`).join('\n');
  // サービス記録は直近30件まで（コンテキスト肥大を防ぐ）
  const recs=[...(careRecords||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const recLines=recs.slice(0,30).map(r=>
    `・${r.date} ${rn(r.residentName)}／${r.serviceType||'-'}・${r.category||'-'} ${r.startTime||''}-${r.endTime||''} 担当:${sn(r.staffName)} 内容:${(r.content||'').replace(/\n/g,' ')}${r.notes?('　備考:'+r.notes.replace(/\n/g,' ')):''}`).join('\n');
  const recNote=recs.length>30?`\n（他 ${recs.length-30} 件は省略）`:'';
  // 経理は直近3か月のP&L
  const acctLines=Object.keys(acct||{}).sort().slice(-3).map(m=>{
    const d=acct[m];const inc=Object.values(d.income||{}).reduce((s,v)=>s+(+v||0),0);
    const exp=Object.values(d.expense||{}).reduce((s,v)=>s+(+v||0),0);
    return `・${m}: 収入${yen(inc)}／支出${yen(exp)}／損益${yen(inc-exp)}`;}).join('\n');
  const privacyNote=anon
    ?'※プライバシー保護のため、利用者・スタッフは「利用者A」「スタッフB」等の仮名で表しています。回答でも実名は使わずこの仮名で言及してください。受給者証番号は共有していません。'
    :'※利用者の実名を含みます。受給者証番号は共有していません。';
  return `あなたは北海道札幌市の障がい福祉サービス事業所「るみなす」の業務を支援するAIアシスタントです。
運営サービス: 居宅介護・重度訪問介護・移動支援。単位単価=${UNIT_PRICE}円（令和6年度改定レート適用）。
回答は日本語で、介護事業所の実務担当者にわかりやすく、簡潔かつ正確に。制度・加算・請求の一般論を述べる際は確実な範囲で答え、最終判断は国保連・自治体・かんたん介護ソフトの公式情報で確認するよう促してください。不確かな点は推測せず「要確認」と明示してください。
${privacyNote}

【現在の利用者（${(residents||[]).length}名）】
${resLines||'（なし）'}

【スタッフ（${(staff||[]).length}名）】
${staffLines||'（なし）'}

${kLines||'（なし）'}

${recLines||'（未登録）'}${recNote}

${acctLines||'（なし）'}

【かんたん介護ソフト 連携済み請求実績】
${billLines||'（なし）'}`;
}

// SSEストリーミングでClaude APIを呼ぶ。onTextに差分テキストが渡る。
async function streamClaude({system,messages,onText,maxTokens=4096,signal}){
  const key=getApiKey();
  if(!key)throw new Error('APIキーが未設定です。設定タブで入力してください。');
  const model=getModel();
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',signal,
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({model,max_tokens:maxTokens,stream:true,system,messages}),
  });
  if(!resp.ok){
    let msg='APIエラー ('+resp.status+')';
    try{const e=await resp.json();if(e&&e.error&&e.error.message)msg=e.error.message;}catch{}
    if(resp.status===401)msg='APIキーが無効です。設定タブで正しいキーを入力してください。';
    throw new Error(msg);
  }
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';let full='';
  let inTok=0,outTok=0;
  const record=()=>{if(inTok||outTok)addUsage(model,inTok,outTok);};
  try{
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();if(!data)continue;
        try{
          const j=JSON.parse(data);
          if(j.type==='message_start'&&j.message&&j.message.usage){inTok=j.message.usage.input_tokens||0;}
          else if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta'){
            full+=j.delta.text;onText&&onText(j.delta.text);
          }
          else if(j.type==='message_delta'&&j.usage){outTok=j.usage.output_tokens||outTok;}
        }catch{}
      }
    }
  }catch(e){record();throw e;} // 中断時も計測済み分は記録
  record();
  return full;
}

// 軽量Markdown→HTML（見出し・箇条書き・番号・太字・コードのみ対応）
function mdToHtml(src){
  const esc=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=(s)=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines=(src||'').split('\n');let html='';let list=null;
  const closeList=()=>{if(list){html+='</'+list+'>';list=null;}};
  for(const raw of lines){
    const line=raw.replace(/\s+$/,'');
    let m;
    if((m=line.match(/^\s*#{1,3}\s+(.*)$/))){closeList();html+='<div class="md-h">'+inline(m[1])+'</div>';continue;}
    if((m=line.match(/^\s*(?:[-*・]|•)\s+(.*)$/))){if(list!=='ul'){closeList();list='ul';html+='<ul>';}html+='<li>'+inline(m[1])+'</li>';continue;}
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=='ol'){closeList();list='ol';html+='<ol>';}html+='<li>'+inline(m[1])+'</li>';continue;}
    if(line.trim()===''){closeList();html+='<div class="md-sp"></div>';continue;}
    closeList();html+='<div>'+inline(line)+'</div>';
  }
  closeList();return html;
}

function AIAssistant(props){

  const [msgs,setMsgs]=useState(()=>{try{return JSON.parse(localStorage.getItem(AI_CHAT_LS)||'[]');}catch{return [];}}); // {role,content}
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [stream,setStream]=useState('');
  const [err,setErr]=useState('');
  const [anon,setAnon]=useState(()=>{try{return localStorage.getItem('ruminasu_aiAnon')!=='0';}catch{return true;}});
  const [model,setModel]=useState(()=>getModel());
  const [budget,setBudget]=useState(()=>getBudget());
  const [usageTick,setUsageTick]=useState(0); // 使用量表示の再計算トリガ

  const sys=useMemo(()=>buildAISystem(props,{anonymize:anon}),[props.residents,props.staff,props.kasan,props.careRecords,props.acct,anon]);
  const spentJPY=useMemo(()=>monthCostJPY(getUsage(),curM()),[usageTick]);

  React.useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[msgs,stream]);
  React.useEffect(()=>{try{localStorage.setItem(AI_CHAT_LS,JSON.stringify(msgs));}catch{}},[msgs]);

  const stop=()=>{if(abortRef.current)abortRef.current.abort();};

  async function send(text){
    const content=(text!=null?text:input).trim();
    if(!content||busy)return;
    // 月次予算チェック（0=無制限）
    if(budget>0){

      }else{
        setErr(e.message||'通信に失敗しました');

            </div>
            <div className="fg">
              <label>Anthropic API キー（sk-ant-... ）</label>
              <input className="fc" type="password" value={keyInput} placeholder="sk-ant-..."
                onChange={e=>setKeyInput(e.target.value)} />

            </p>

              <span style={{fontSize:13,fontWeight:600}}>利用者・スタッフ名を匿名化して送信</span>
            </div>
            <p style={{fontSize:11.5,color:'var(--tl)',marginBottom:0}}>
              {anon
                ?'✅ ONの間は、実名を「利用者A」「スタッフB」等の仮名に置き換えてAIに送信します（受給者証番号は常に送信しません）。個人情報保護の観点から推奨。'
                :'⚠️ OFFにすると利用者・スタッフの実名がAnthropicのAPIへ送信されます。障害情報は要配慮個人情報です。利用者の同意・委託先管理を確認のうえご利用ください。'}
            </p>
            <div className="divider"></div>
            <div className="fg">
              <label>利用モデル</label>
              <select className="fc" value={model} onChange={e=>changeModel(e.target.value)}>
                {AI_MODELS.map(m=><option key={m.id} value={m.id}>{m.name}（入力${m.inUSD}/出力${m.outUSD}・100万トークン）</option>)}
              </select>
            </div>
            <div className="fg" style={{marginBottom:6}}>
              <label>月次予算（円・0で無制限）</label>
              <input className="fc" type="number" min="0" step="500" value={budget} onChange={e=>changeBudget(e.target.value)} style={{maxWidth:200}} />
            </div>
            <div className="notice n-info" style={{marginBottom:0}}>
              今月のAI利用概算額：<b>{yen(spentJPY)}</b>{budget>0?`（予算 ${yen(budget)}）`:'（予算未設定）'}<br/>
              <span style={{fontSize:11}}>※料金は目安（${modelInfo(model).inUSD}/${modelInfo(model).outUSD} per 100万トークン・1ドル≒{USD_JPY}円換算）。正確な請求額はconsole.anthropic.comでご確認ください。</span>
            </div>
            <div className="divider"></div>
            <p style={{fontSize:12,color:'var(--tl)'}}>キーはこのブラウザ内（localStorage）にのみ保存されます。</p>
          </div>
        </div>
      ):(
        <div className="ai-wrap">
          <div className="ai-quick">
            {AI_QUICK.map(q=>(
              <button key={q.id} className="ai-chip" disabled={busy} onClick={()=>send(q.prompt)}>{q.label}</button>
            ))}
            {msgs.length>0&&<button className="ai-chip" disabled={busy} onClick={clearChat}>🗑 クリア</button>}
          </div>
          <div className="ai-msgs" ref={scrollRef}>
            {msgs.length===0&&!stream&&(
              <div className="empty-state">
                <div className="empty-icon">💬</div>
                <p>加算・請求・制度の質問や、上のクイックアクションをどうぞ。</p>
                <p style={{fontSize:11,marginTop:6}}>例：「受給者証の期限が近い利用者は？」「特定事業所加算Ⅰの要件は？」</p>
              </div>
            )}
            {msgs.map((m,i)=>(
              <div key={i} className={`ai-row ${m.role==='user'?'user':''}`}>
                <div className={`ai-av ${m.role==='user'?'user':'bot'}`}>{m.role==='user'?'🧑':'🌿'}</div>
                {m.role==='user'
                  ?<div className="ai-bubble user">{m.content}</div>
                  :<div className="ai-bubble bot" dangerouslySetInnerHTML={{__html:mdToHtml(m.content)}}/>}
              </div>
            ))}
            {(busy||stream)&&(
              <div className="ai-row">
                <div className="ai-av bot">🌿</div>
                <div className="ai-bubble bot"><span dangerouslySetInnerHTML={{__html:mdToHtml(stream)}}/>{busy&&<span className="ai-cursor"></span>}</div>
              </div>
            )}
          </div>
          {err&&<div className="notice n-danger" style={{marginTop:10}}>⚠️ {err}</div>}
          <div className="ai-input-bar">
            <textarea className="ai-input" rows={1} value={input} placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent.isComposing&&e.keyCode!==229){e.preventDefault();send();}}} />
            {busy
              ?<button className="btn btn-danger" onClick={stop}>■ 停止</button>
              :<button className="btn btn-primary" disabled={!input.trim()} onClick={()=>send()}>送信</button>}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [page,setPage]=useState('dashboard');
  const [residents,setResidents]=useState(()=>initD('residents',INIT_RESIDENTS));
  const [careRecords,setCareRecords]=useState(()=>ls('careRecords',[]));
  const [staff,setStaff]=useState(()=>initD('staff',INIT_STAFF));
  const [shifts,setShifts]=useState(()=>ls('shifts',[]));
  const [legalUpdates,setLegalUpdates]=useState(()=>ls('legalUpdates',[]));
  const [kasan,setKasan]=useState(()=>migrateKasan(ls('kasanSettings',DEFAULT_KASAN)));
  const [acct,setAcct]=useState(()=>ls('accounting',DEFAULT_ACCT));
  // 新キーは初回アクセス時に空配列で初期化（既存キーには影響しない）
  const [contracts,setContracts]=useState(()=>initD('ruminasu_contracts',[]));
  const [training,setTraining]=useState(()=>initD('ruminasu_training',[]));
  const NAV=[
    {id:'dashboard',icon:'🏡',label:'ダッシュボード'},
    {id:'residents',icon:'👤',label:'利用者管理'},
    {id:'care',icon:'📝',label:'ケア記録・実績'},
    {id:'staff',icon:'👥',label:'シフト・勤怠'},
    {id:'kasan',icon:'⚡',label:'加算管理'},
    {id:'billing',icon:'🏛️',label:'月次請求'},
    {id:'accounting',icon:'💰',label:'経理管理'},
    {id:'contract',icon:'📜',label:'契約・研修'},
    {id:'legal',icon:'📢',label:'法令・制度更新'},
    {id:'ai',icon:'🤖',label:'AIアシスタント'},
  ];
  const dangerCount=legalUpdates.filter(u=>u.type==='danger').length;
  const certAlerts=residents.filter(r=>{if(!r.certExpiry)return false;const d=(new Date(r.certExpiry)-new Date())/(1000*60*60*24);return d<60;}).length;
  return(
    <div className="app">
      <nav className="sidebar">
        <div className="sidebar-logo">
          <h1>🌿 るみなす</h1>
          <p>障がい福祉統合管理システム</p>
        </div>
        <div className="sidebar-nav">
          {NAV.map(n=>(
            <div key={n.id} className={`nav-item${page===n.id?' active':''}`} onClick={()=>setPage(n.id)}>
              <span className="nav-icon">{n.icon}</span>
              <span>{n.label}</span>
              {n.id==='legal'&&dangerCount>0&&<span style={{marginLeft:'auto',background:'#E74C3C',color:'white',borderRadius:9,padding:'1px 6px',fontSize:11}}>{dangerCount}</span>}
              {n.id==='residents'&&certAlerts>0&&<span style={{marginLeft:'auto',background:'#F39C12',color:'white',borderRadius:9,padding:'1px 6px',fontSize:11}}>{certAlerts}</span>}
            </div>
          ))}
        </div>
        <div className="sidebar-footer">
          <div style={{display:'flex',gap:6,marginBottom:10}}>
            <button onClick={exportAllData} title="全データをJSONファイルに書き出します"
              style={{flex:1,padding:'6px 4px',borderRadius:6,border:'1px solid rgba(255,255,255,.4)',background:'rgba(255,255,255,.15)',color:'white',fontSize:10.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>💾 バックアップ</button>
            <label title="バックアップJSONから復元します"
              style={{flex:1,padding:'6px 4px',borderRadius:6,border:'1px solid rgba(255,255,255,.4)',background:'rgba(255,255,255,.15)',color:'white',fontSize:10.5,fontWeight:600,cursor:'pointer',textAlign:'center'}}>
              📥 復元
              <input type="file" accept="application/json,.json" style={{display:'none'}}
                onChange={e=>{if(e.target.files&&e.target.files[0])importAllData(e.target.files[0]);e.target.value='';}}/>
            </label>
          </div>
          <p style={{fontWeight:700,marginBottom:1}}>© るみなす</p>
          <p>北海道札幌市 障がい福祉</p>
          <p style={{marginTop:2}}>居宅介護・重度訪問・移動支援</p>
        </div>
      </nav>
      <main className="main">
        {page==='dashboard'&&<Dashboard residents={residents} careRecords={careRecords} staff={staff} legalUpdates={legalUpdates} kasan={kasan} acct={acct} contracts={contracts} training={training} setPage={setPage}/>}
        {page==='residents'&&<Residents residents={residents} setResidents={setResidents}/>}
        {page==='care'&&<CareRecords residents={residents} careRecords={careRecords} setCareRecords={setCareRecords} staff={staff}/>}
        {page==='staff'&&<StaffShifts staff={staff} setStaff={setStaff} shifts={shifts} setShifts={setShifts}/>}
        {page==='kasan'&&<KasanManager kasan={kasan} setKasan={setKasan} staff={staff} residents={residents}/>}
        {page==='billing'&&<MonthlyBilling residents={residents} careRecords={careRecords} kasan={kasan}/>}
        {page==='accounting'&&<AccountingManager acct={acct} setAcct={setAcct}/>}
        {page==='contract'&&<ContractsTraining contracts={contracts} setContracts={setContracts} training={training} setTraining={setTraining} staff={staff}/>}
        {page==='legal'&&<LegalUpdates legalUpdates={legalUpdates} setLegalUpdates={setLegalUpdates}/>}
        {page==='ai'&&<AIAssistant residents={residents} careRecords={careRecords} staff={staff} shifts={shifts} kasan={kasan} acct={acct}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
